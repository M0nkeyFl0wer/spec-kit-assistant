schema_version: "1.0"

extension:
  id: "guide"
  name: "Spec Kit Guide"
  version: "0.1.0"
  description: "New to spec-driven development? Say what you want to build. Spec asks a few questions, runs each step, and keeps the AI on the plan."
  category: "process"
  effect: "read-write"
  author: "M0nkeyFl0wer"
  repository: "https://github.com/M0nkeyFl0wer/spec-kit-assistant"
  license: "MIT"
  homepage: "https://github.com/M0nkeyFl0wer/spec-kit-assistant"

requires:
  # Developed and tested against 1.4.x. Runtime events exist in earlier
  # releases, but nothing older has been tried.
  speckit_version: ">=1.4.0"
  tools:
    - name: "python3"
      required: true

provides:
  commands:
    - name: "speckit.guide.next"
      file: "commands/speckit.guide.next.md"
      description: "Not sure what to do? Start here. Asks a few questions, then runs the next step for you"
      aliases: ["speckit.guide.start"]
    - name: "speckit.guide.tour"
      file: "commands/speckit.guide.tour.md"
      description: "New here? A two-minute plain-language tour of how this works and what is available"
    - name: "speckit.guide.status"
      file: "commands/speckit.guide.status.md"
      description: "Where am I? Shows what is done, what is next, and whether the guide is holding the plan"
    - name: "speckit.guide.pause"
      file: "commands/speckit.guide.pause.md"
      description: "Stop a build that is in progress. You can pick it up again later"
    - name: "speckit.guide.unlock"
      file: "commands/speckit.guide.unlock.md"
      description: "Let the assistant edit code now, for this session only, even though the plan is not finished"
    - name: "speckit.guide.harness"
      file: "commands/speckit.guide.harness.md"
      description: "Internal: the script behind the session, prompt, edit and stop events"

  config:
    - name: "guide-config.yml"
      template: "config-template.yml"
      description: "Gate, keep-going and persona settings"
      required: false

# Runtime events run scripts/python/guide.py directly. Spec Kit translates
# each one into the coding agent's own hook system (for Claude Code:
# SessionStart, UserPromptSubmit, PreToolUse and Stop in .claude/settings.json).
events:
  session_start:
    command: "speckit.guide.harness"
    timeout: 10
  user_prompt_submit:
    command: "speckit.guide.harness"
    timeout: 10
  pre_tool_use:
    command: "speckit.guide.harness"
    # Only file-editing tools are gated, so do not start Python for the rest.
    matcher: "Write|Edit|MultiEdit|NotebookEdit"
    timeout: 10
  stop:
    command: "speckit.guide.harness"
    timeout: 10

# Hooks are prompts, so the agent may skip them. They are here for agents
# whose integration does not support runtime events.
hooks:
  after_specify:
    command: "speckit.guide.next"
    optional: true
    prompt: "Want a walk through the next step?"
    description: "Offer the guided next step after the spec is written"
  after_plan:
    command: "speckit.guide.next"
    optional: true
    prompt: "Want a walk through the next step?"
    description: "Offer the guided next step after the plan is written"
  after_tasks:
    command: "speckit.guide.next"
    optional: true
    prompt: "Want a walk through the next step?"
    description: "Offer the guided next step after the tasks are written"

tags:
  - "onboarding"
  - "guardrails"
  - "workflow"
  - "claude-code"
  - "beginner"

defaults:
  persona: "spec"
  gate: "block"
  require_spec: true
  keep_going: true
